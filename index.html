<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PACIUCIU LEAGUE</title>
  <meta name="description" content="Rywalizacja wędkarska - punktacja za złowione pstrągi" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1F3A34" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PaciuciuLeague" />

  <link rel="stylesheet" href="style.css?v=20261101-2" />
</head>
<body>
  <div id="root"></div>

  <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
  <script src="config.js?v=20261101-2"></script>
  <script src="app.js?v=20261101-2"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        const wasControlled = !!navigator.serviceWorker.controller;
        let notified = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!wasControlled || notified) return;
          notified = true;
          const notice = document.createElement("div");
          notice.style.cssText = "position:fixed;bottom:16px;left:16px;right:16px;z-index:10000;background:#1F3A34;color:white;padding:16px;border:1px solid #C97A3D;border-radius:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap";
          const text = document.createElement("span");
          text.textContent = "Dostępna nowa wersja aplikacji. Zapisz rozpoczęty wpis i odśwież.";
          const button = document.createElement("button");
          button.className = "btn-copper";
          button.textContent = "Odśwież aplikację";
          button.onclick = () => window.location.reload();
          notice.append(text, button);
          document.body.appendChild(notice);
        });
        navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" }).then(registration => {
          const checkUpdate = () => registration.update().catch(() => {});
          checkUpdate();
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") checkUpdate();
          });
          window.addEventListener("online", checkUpdate);
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
